name: Bench knobs

on:
  push:
    branches: ['bagel/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - knobs: 'off'
            race: ''
          - knobs: production
            race: '-race'
          - knobs: eviction
            race: '-race'
          - knobs: eviction-only
            race: '-race'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set production knobs
        if: matrix.knobs == 'production' || matrix.knobs == 'eviction'
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          NATS_BENCH_TLS_COLLAPSE=1
          NATS_BENCH_PROPOSE_COALESCE=200us
          NATS_BENCH_ACKNONE_PROPOSE_EVERY=64
          NATS_BENCH_DELIVER_BATCH=32
          NATS_BENCH_SIGNAL_COALESCE=1
          NATS_BENCH_HDR_INDEX=1
          NATS_BENCH_STAGE_ARENA=1
          NATS_BENCH_RING_INDEX=1
          NATS_BENCH_STORE_SLAB=1
          NATS_BENCH_INTERN=1
          EOF
      - name: Set eviction knob
        if: matrix.knobs == 'eviction' || matrix.knobs == 'eviction-only'
        run: echo 'NATS_BENCH_EVICT_BATCH=64' >> "$GITHUB_ENV"
      - name: Test
        run: go test ./server -run 'Schedul|MemStore|JetStreamBatch|JetStreamAtomicBatch|Stream.*Limit|Consumer.*Pending|LimitEviction|HdrIndex|MsgIndex|Slab|TLS|JetStreamConsumer|JetStreamCluster.*(Consumer|Ack|Pending|Leafnode)' ${{ matrix.race }} -count=1 -timeout 60m
